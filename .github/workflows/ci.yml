name: CI

# Step 4 hardening gate. Runs on pull requests and blocks the merge when a gate
# or a performance budget regresses. The Step 1 deploy job is separate and is
# not touched here.
on:
  pull_request:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Lighthouse CI budgets
        run: npx --yes @lhci/cli@0.15.x autorun
